name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build scripts
        run: python3 scripts/build.py --outdir ./dist

      - name: Syntax check
        run: |
          for f in dist/*.sh; do
            bash -n "$f"
            echo "OK: $f"
          done

      - name: Verify translation completeness
        run: python3 scripts/build.py --check-keys
